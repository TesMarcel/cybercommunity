<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum — Cyber Community</title>
  <link rel="icon" href="data:,">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/forum.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">&gt; cyber_community</a>
    </div>
  </header>

  <main id="main">
    <div class="page-title">
      <h1>Forum</h1>
      <button class="button-primary" type="button" id="new-post-toggle" aria-expanded="false" aria-controls="new-post">Nouvelle discussion</button>
    </div>

    <section class="card hidden" id="new-post" aria-labelledby="new-post-title">
      <h2 id="new-post-title">Nouvelle discussion</h2>
      <div id="new-post-message" aria-live="polite"></div>
      <form id="new-post-form" novalidate>
        <div class="field">
          <label for="title">Titre</label>
          <input id="title" name="title" required maxlength="200">
        </div>
        <div class="field">
          <label for="category">Catégorie</label>
          <select id="category" name="category"></select>
        </div>
        <div class="field">
          <label for="content">Contenu</label>
          <textarea id="content" name="content" required maxlength="20000"></textarea>
        </div>
        <div class="row">
          <button class="button-primary" type="submit">Publier</button>
          <button type="button" id="new-post-cancel">Annuler</button>
        </div>
      </form>
    </section>

    <form class="filters" id="filters" role="search">
      <label class="sr-only" for="q">Rechercher</label>
      <input id="q" name="q" type="search" placeholder="Rechercher dans le forum…">
      <label class="sr-only" for="filter-category">Catégorie</label>
      <select id="filter-category" name="category"></select>
      <button type="submit">Rechercher</button>
    </form>

    <div id="list-message" aria-live="polite"></div>
    <ul class="post-list" id="posts"></ul>
    <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
  </main>

  <footer class="site-footer">Cyber Community — communauté cybersécurité, programmation, Linux et CTF</footer>
</body>
</html>
