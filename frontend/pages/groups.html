<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groupes — Cyber Community</title>
  <link rel="icon" href="data:,">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/groups.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">&gt; cyber_community</a>
    </div>
  </header>

  <main id="main" class="wide-page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Groupes</p>
        <h1>Groupes</h1>
        <p class="muted">Travaillez en petit comité : discussions, messagerie et partage de fichiers.</p>
      </div>
      <button class="button-primary hidden" type="button" id="new-group-toggle" aria-expanded="false" aria-controls="new-group">Créer un groupe</button>
    </div>

    <section class="card hidden" id="new-group" aria-labelledby="new-group-title">
      <h2 id="new-group-title">Nouveau groupe</h2>
      <div id="new-group-message" aria-live="polite"></div>
      <form id="new-group-form" novalidate>
        <div class="field">
          <label for="name">Nom</label>
          <input id="name" name="name" required maxlength="120">
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" maxlength="2000"></textarea>
        </div>
        <div class="field">
          <label class="row"><input type="checkbox" class="checkbox" id="is_private" name="is_private" checked> Groupe privé (visible et accessible sur invitation uniquement)</label>
        </div>
        <div class="row">
          <button class="button-primary" type="submit">Créer</button>
          <button type="button" id="new-group-cancel">Annuler</button>
        </div>
      </form>
    </section>

    <div class="segmented" role="group" aria-label="Filtrer les groupes" id="group-filter">
      <button type="button" data-filter="all" aria-pressed="true">Tous</button>
      <button type="button" data-filter="mine" aria-pressed="false">Mes groupes</button>
      <button type="button" data-filter="public" aria-pressed="false">Publics</button>
      <button type="button" data-filter="private" aria-pressed="false">Privés</button>
    </div>

    <div id="message" aria-live="polite"></div>
    <ul class="group-grid" id="groups"></ul>
  </main>

  <footer class="site-footer">Cyber Community — communauté cybersécurité, programmation, Linux et CTF</footer>
</body>
</html>
