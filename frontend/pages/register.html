<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription — Cyber Community</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">&gt; cyber_community</a>
    </div>
  </header>

  <main id="main">
    <section class="narrow card" aria-labelledby="title">
      <h1 id="title">Créer un compte</h1>
      <div id="message" aria-live="polite"></div>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_.\-]{3,30}" aria-describedby="username-hint">
          <p class="hint" id="username-hint">3 à 30 caractères : lettres, chiffres, _ . -</p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
        </div>
        <div class="field">
          <label for="country">Pays</label>
          <input id="country" name="country" autocomplete="country-name" required maxlength="100">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-hint">
          <p class="hint" id="password-hint">8 caractères minimum</p>
        </div>
        <div class="field">
          <label for="confirm">Confirmer le mot de passe</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        </div>
        <button class="button-primary" type="submit">Créer mon compte</button>
      </form>
      <p class="muted small">Déjà inscrit ? <a href="/pages/login.html">Se connecter</a></p>
    </section>
  </main>

  <footer class="site-footer">Cyber Community — communauté cybersécurité, programmation, Linux et CTF</footer>
</body>
</html>
